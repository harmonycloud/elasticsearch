apiVersion: middleware.cn/v1
kind: MiddlewareActionBaseline
metadata:
  name: elasticsearch-backup-schedule
  annotations:
    alias: "Scheduled Backup"
spec:
  baselineType: "NormalAction"
  actionType: "backupSchedule"
  necessary:
    # Resource name (metadata.name) provided by the caller
    # 资源名 (metadata.name) 由调用方传入
    name: '{"type":"string","label":"Resource Name","required":true,"visible": true}'
    # handleType controls pause/resume/delete branches in the cue template below
    # handleType 用于控制下方 cue 模板中的 pause/resume/delete 分支
    handleType: '{"type":"enum","label":"handleType","required":true,"options":"create,update,pause,resume,delete","visible": true}'
    bucket: '{"type":"string","label":"Bucket Name","required":true,"visible": true}'
    url: '{"type":"string","label":"MinIO Endpoint","required":true,"visible": true}'
    userId: '{"type":"string","label":"Access Key (base64)","required":true,"visible": true}'
    userKey: '{"type":"string","label":"Secret Key (base64)","required":true,"visible": true}'
    cron: '{"type":"string","label":"Cron Expression","required":true,"visible": true,"placeholder":"0/3 * * * *"}'
    retentionTime: '{"type":"int","label":"Retention Time (days)","required":true,"visible": true}'
    # operationType injected as env OPERATION_TYPE into spec.customBackups
    # operationType 作为 OPERATION_TYPE 环境变量注入到 spec.customBackups
    operationType: '{"type":"string","label":"Operation Type (mapped to env OPERATION_TYPE)","required":true,"visible": true}'
    annotations: '{"type":"string","label":"Additional Annotations (JSON map)","required":false,"visible": true}'
  steps:
    - name: manage-schedule
      type: "KubectlEdit"
      cue: |
        output: {
          spec: parameters.spec
        }
        parameters: {
          spec: {
            {{- if ne .Necessary.handleType "delete" }}
            name: "{{ .Globe.MiddlewareName }}"
            type: "escluster"
            {{- if eq .Necessary.handleType "pause" }}
            pause: "on"
            {{- else }}
            pause: "off"
            {{- end }}
            schedule: {
              cron: "{{ .Necessary.cron }}"
              limitRecord: 5
              retentionTime: {{ .Necessary.retentionTime }}
            }
            backupDestination: {
              destinationType: "minio"
              parameters: {
                bucket: "{{ .Necessary.bucket }}"
                url: "{{ .Necessary.url }}"
                bucketSubPath: "{{ .Globe.MiddlewareName }}"
                userId: "{{ .Necessary.userId }}"
                userKey: "{{ .Necessary.userKey }}"
              }
            }
            customBackups: [{
              env: [{
                name: "OPERATION_TYPE"
                value: "{{ .Necessary.operationType }}"
              }]
            }]
            {{- end }}
          }
          resource: {
            apiVersion: "harmonycloud.cn/v1"
            kind: "MiddlewareBackupSchedule"
            name: "{{ .Necessary.name }}"
            namespace: "{{ .Globe.Namespace }}"
            annotations: {
              "middlewarebackup.job.mode": "snapshot"
              {{- if .Necessary.annotations }}
              {{ .Necessary.annotations }}
              {{- end }}
            }
          }
        }
    - name: delete-schedule
      cmd:
        command:
          - '{{ if ne .Necessary.handleType "delete" }}printf 1{{ else }}kubectl delete middlewarebackupschedule {{ .Necessary.name }} -n {{ .Globe.Namespace }}{{ end }}'
