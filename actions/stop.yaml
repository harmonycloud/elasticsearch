apiVersion: middleware.cn/v1
kind: MiddlewareActionBaseline
metadata:
  name: elasticsearch-stop
  annotations:
    alias: "Stop"
spec:
  baselineType: "NormalAction"
  actionType: "stop"
  necessary: {}
  steps:
    - name: getBaselineName
      output:
        type: "string"
        expose: true
      cmd:
        command:
          - |
            kubectl get mid {{ .Globe.MiddlewareName }} -n {{ .Globe.Namespace }} -o jsonpath='{.metadata.labels.middleware\.cn/definition}'
    - name: stop
      output:
        type: "string"
        expose: true
      cmd:
        command:
          - |
            {{- if eq .Step.getBaselineName.output "elasticsearch-cluster" -}}
            # Cluster 模式（simple）：仅 master 角色，副本数由 .spec.necessary.resource.master.replicas 控制
            kubectl patch mid {{ .Globe.MiddlewareName }} -n {{ .Globe.Namespace }} --type=merge -p '{"spec":{"necessary":{"resource":{"master":{"replicas":0}}}}}'
            {{- else if eq .Step.getBaselineName.output "elasticsearch-cluster-active" -}}
            # Cluster A-A 模式：仅 master 角色，副本数由 .spec.necessary.resource.master.replicas 控制
            kubectl patch mid {{ .Globe.MiddlewareName }} -n {{ .Globe.Namespace }} --type=merge -p '{"spec":{"necessary":{"resource":{"master":{"replicas":0}}}}}'
            {{- else if eq .Step.getBaselineName.output "elasticsearch-complex-cluster" -}}
            # Mixed 模式：多角色（master/data/client/cold/kibana）均需要停
            kubectl patch mid {{ .Globe.MiddlewareName }} -n {{ .Globe.Namespace }} --type=merge -p '{"spec":{"necessary":{"resource":{"master":{"replicas":0},"data":{"replicas":0},"client":{"replicas":0},"cold":{"replicas":0},"kibana":{"replicas":0}}}}}'
            {{- else if eq .Step.getBaselineName.output "elasticsearch-complex-cluster-active" -}}
            # Mixed A-A 模式：多角色（master/data/client/cold/kibana）均需要停
            kubectl patch mid {{ .Globe.MiddlewareName }} -n {{ .Globe.Namespace }} --type=merge -p '{"spec":{"necessary":{"resource":{"master":{"replicas":0},"data":{"replicas":0},"client":{"replicas":0},"cold":{"replicas":0},"kibana":{"replicas":0}}}}}'
            {{- else -}}
            # 兜底：默认按 master 角色处理
            kubectl patch mid {{ .Globe.MiddlewareName }} -n {{ .Globe.Namespace }} --type=merge -p '{"spec":{"necessary":{"resource":{"master":{"replicas":0}}}}}'
            {{- end -}}
