apiVersion: middleware.cn/v1
kind: MiddlewareActionBaseline
metadata:
  name: elasticsearch-stop
  annotations:
    alias: "Stop"
spec:
  baselineType: "NormalAction"
  actionType: "stop"
  necessary: {}
  steps:
    - name: stop
      output:
        type: "string"
        expose: true
      cmd:
        command:
          - |
            # Suspend the cluster: ES operator 1.14+ scales all pods to 0 while preserving PVC data
            # 通过将 mid 的 spec.parameters.suspended 置为 true，让 ES Operator 把集群缩容到 0（保留 PVC 数据）
            kubectl patch mid {{ .Globe.MiddlewareName }} -n {{ .Globe.Namespace }} --type=merge -p '{"spec":{"parameters":{"suspended":true}}}'
